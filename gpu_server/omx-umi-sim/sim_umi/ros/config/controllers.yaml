# controller_manager configuration for the MuJoCo-backed OMX-F.
#
# The controller NAMES are ROBOTIS's: their moveit_controllers.yaml addresses
# arm_controller (FollowJointTrajectory over joint1..joint5) and
# gripper_controller (GripperCommand on gripper_joint_1), so using anything
# else here would mean rewriting a file we want to reuse untouched.
controller_manager:
  ros__parameters:
    update_rate: 500  # Hz
    # Every controller is a node of its own inside this process, and each has
    # to be told, or it stamps on the system clock while the camera stamps on
    # the simulation one.
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/GripperActionController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
    # The controller manager runs at 500 Hz and the broadcaster followed it.
    # A recorder spinning one callback at a time then drowns in joint states
    # and the camera callback starves: during collection the image lagged so
    # far behind that the gripper width read "open" through an entire grasp.
    publish_rate: 100.0

arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0

gripper_controller:
  ros__parameters:
    use_sim_time: true
    joint: gripper_joint_1
    # the jaw shuts on the object and the current limit stops it, so a
    # position error at the goal is the normal outcome, not a failure
    allow_stalling: true
    max_effort: 2.0
    goal_tolerance: 0.05
