name: train_diffusion_unet_timm_omx
_target_: diffusion_policy.workspace.train_diffusion_unet_image_workspace.TrainDiffusionUnetImageWorkspace
task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: twin_b
n_action_steps: 8
policy:
  _target_: diffusion_policy.policy.diffusion_unet_timm_relation_film_policy.DiffusionUnetTimmRelationFilmPolicy
  shape_meta: ${shape_meta}
  noise_scheduler:
    _target_: diffusers.DDIMScheduler
    num_train_timesteps: 50
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: true
    set_alpha_to_one: true
    steps_offset: 0
    prediction_type: epsilon
  obs_encoder:
    _target_: diffusion_policy.model.vision.timm_relation_film_obs_encoder.TimmRelationFilmObsEncoder
    shape_meta: ${shape_meta}
    model_name: vit_base_patch16_clip_224.openai
    pretrained: true
    frozen: false
    global_pool: ''
    feature_aggregation: attention_pool_2d
    position_encording: sinusoidal
    downsample_ratio: 32
    transforms:
    - type: RandomCrop
      ratio: 0.95
    - _target_: torchvision.transforms.ColorJitter
      brightness: 0.3
      contrast: 0.4
      saturation: 0.5
      hue: 0.08
    use_group_norm: true
    share_rgb_model: false
    imagenet_norm: true
    target_mask_key: camera0_target_mask
    ee_mask_key: camera0_ee_tip_mask
    target_valid_key: camera0_target_mask_valid
    min_target_px: 12
    relation_hidden: 256
    relation_init_seed: 20260928
  num_inference_steps: 16
  obs_as_global_cond: true
  diffusion_step_embed_dim: 128
  down_dims:
  - 256
  - 512
  - 1024
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true
  input_pertub: 0.1
  train_diffusion_n_samples: 1
ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999
dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: true
  pin_memory: true
  persistent_workers: true
val_dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: false
  pin_memory: true
  persistent_workers: true
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0003
  betas:
  - 0.95
  - 0.999
  eps: 1.0e-08
  weight_decay: 1.0e-06
training:
  device: cuda:0
  seed: 42
  debug: false
  resume: true
  lr_scheduler: cosine
  lr_warmup_steps: 2000
  num_epochs: 100
  gradient_accumulate_every: 1
  use_ema: true
  freeze_encoder: false
  rollout_every: 10
  checkpoint_every: 10
  val_every: 1
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0
  mixed_precision: fp16
  lr_scheduler_total_steps: 11400
  checkpoint_at_steps: []
  init_state_path: /home/j-j15a206/universal_manipulation_interface/sim_umi/train_results/2026-09-27_definitive/shared_init/init_state.pt
  max_opt_steps: 20
  twin_probe_steps: 20
  twin_probe_path: /home/j-j15a206/universal_manipulation_interface/sim_umi/train_results/2026-09-28_aux_ablations/twin_r2/b/probe
logging:
  project: omx-umi
  resume: false
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${exp_name}
  tags:
  - ${name}
  - ${task_name}
  - ${exp_name}
  id: null
  group: null
checkpoint:
  topk:
    monitor_key: train_loss
    mode: min
    k: 20
    format_str: epoch={epoch:04d}-train_loss={train_loss:.3f}.ckpt
  save_last_ckpt: true
  save_last_snapshot: false
multi_run:
  run_dir: data/omx/train/${exp_name}/${now:%Y.%m.%d}/${now:%H.%M.%S}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${exp_name}
task:
  name: umi_omx
  camera_obs_latency: 0.125
  robot_obs_latency: 0.0001
  gripper_obs_latency: 0.02
  dataset_frequeny: 0
  obs_down_sample_steps: 1
  low_dim_obs_horizon: 2
  img_obs_horizon: 2
  action_horizon: 16
  ignore_proprioception: false
  shape_meta:
    obs:
      camera0_rgb:
        shape:
        - 3
        - 224
        - 224
        horizon: ${task.img_obs_horizon}
        latency_steps: 0
        down_sample_steps: ${task.obs_down_sample_steps}
        type: rgb
        ignore_by_policy: false
      robot0_eef_pos:
        shape:
        - 3
        horizon: ${task.low_dim_obs_horizon}
        latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.robot_obs_latency})
          * ${task.dataset_frequeny}'}
        down_sample_steps: ${task.obs_down_sample_steps}
        type: low_dim
        ignore_by_policy: ${task.ignore_proprioception}
      robot0_eef_rot_axis_angle:
        raw_shape:
        - 3
        shape:
        - 6
        horizon: ${task.low_dim_obs_horizon}
        latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.robot_obs_latency})
          * ${task.dataset_frequeny}'}
        down_sample_steps: ${task.obs_down_sample_steps}
        type: low_dim
        rotation_rep: rotation_6d
        ignore_by_policy: ${task.ignore_proprioception}
      robot0_gripper_width:
        shape:
        - 1
        horizon: ${task.low_dim_obs_horizon}
        latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.gripper_obs_latency})
          * ${task.dataset_frequeny}'}
        down_sample_steps: ${task.obs_down_sample_steps}
        type: low_dim
        ignore_by_policy: ${task.ignore_proprioception}
      robot0_eef_rot_axis_angle_wrt_start:
        raw_shape:
        - 3
        shape:
        - 6
        horizon: ${task.low_dim_obs_horizon}
        latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.robot_obs_latency})
          * ${task.dataset_frequeny}'}
        down_sample_steps: ${task.obs_down_sample_steps}
        type: low_dim
        ignore_by_policy: ${task.ignore_proprioception}
    action:
      shape:
      - 10
      horizon: ${task.action_horizon}
      latency_steps: 0
      down_sample_steps: ${task.obs_down_sample_steps}
      rotation_rep: rotation_6d
  task_name: umi_omx
  dataset_path: /home/j-j15a206/universal_manipulation_interface/sim_umi/data/omx_sim_train_v2.zarr.zip
  pose_repr:
    obs_pose_repr: relative
    action_pose_repr: relative
  env_runner:
    _target_: diffusion_policy.env_runner.real_pusht_image_runner.RealPushTImageRunner
  dataset:
    _target_: diffusion_policy.dataset.umi_aux_dataset.UmiAuxDataset
    shape_meta:
      obs:
        camera0_rgb:
          shape:
          - 3
          - 224
          - 224
          horizon: ${task.img_obs_horizon}
          latency_steps: 0
          down_sample_steps: ${task.obs_down_sample_steps}
          type: rgb
          ignore_by_policy: false
        robot0_eef_pos:
          shape:
          - 3
          horizon: ${task.low_dim_obs_horizon}
          latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.robot_obs_latency})
            * ${task.dataset_frequeny}'}
          down_sample_steps: ${task.obs_down_sample_steps}
          type: low_dim
          ignore_by_policy: ${task.ignore_proprioception}
        robot0_eef_rot_axis_angle:
          raw_shape:
          - 3
          shape:
          - 6
          horizon: ${task.low_dim_obs_horizon}
          latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.robot_obs_latency})
            * ${task.dataset_frequeny}'}
          down_sample_steps: ${task.obs_down_sample_steps}
          type: low_dim
          rotation_rep: rotation_6d
          ignore_by_policy: ${task.ignore_proprioception}
        robot0_gripper_width:
          shape:
          - 1
          horizon: ${task.low_dim_obs_horizon}
          latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.gripper_obs_latency})
            * ${task.dataset_frequeny}'}
          down_sample_steps: ${task.obs_down_sample_steps}
          type: low_dim
          ignore_by_policy: ${task.ignore_proprioception}
        robot0_eef_rot_axis_angle_wrt_start:
          raw_shape:
          - 3
          shape:
          - 6
          horizon: ${task.low_dim_obs_horizon}
          latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.robot_obs_latency})
            * ${task.dataset_frequeny}'}
          down_sample_steps: ${task.obs_down_sample_steps}
          type: low_dim
          ignore_by_policy: ${task.ignore_proprioception}
      action:
        shape:
        - 10
        horizon: ${task.action_horizon}
        latency_steps: 0
        down_sample_steps: ${task.obs_down_sample_steps}
        rotation_rep: rotation_6d
    dataset_path: ${task.dataset_path}
    cache_dir: null
    pose_repr:
      obs_pose_repr: relative
      action_pose_repr: relative
    action_padding: false
    temporally_independent_normalization: false
    repeat_frame_prob: 0.0
    max_duration: null
    seed: 42
    val_ratio: 0.0
    oracle_mask_path: /home/j-j15a206/universal_manipulation_interface/sim_umi/data/sidecars/omx_sim_train_v2.oracle_masks_g0.zarr.zip
    oracle_mask_names:
    - target_mask
    - ee_tip_mask
